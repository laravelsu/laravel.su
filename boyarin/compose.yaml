services:
  boyarin:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./resources:/var/www/html/resources
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:'.(getenv('SERVER_PORT') ?: '8080').'/health') === 'ok' ? 0 : 1);"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
